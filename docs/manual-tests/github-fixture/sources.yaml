# Zwei Test-Repos im selben Account/Org. ADISPATCH_TEST_OWNER wird beim Kopieren ersetzt (siehe github.md, Abschnitt 2).
# Das dritte Repo (orch-test-hidden) ist bewusst KEINE Source und für keine App installiert.
sources:
  test_a:
    type: github
    owner: ADISPATCH_TEST_OWNER
    repository: orch-test-a
    identity: maintainer    # Lesen (Polling, Dependencies, Views) mit der Maintainer-App
    # T25 (Projektfelder): einkommentieren und Nummer/Owner eintragen (siehe github.md, T25).
    # project:
    #   number: 1                    # Org-Projekt (T25a, per App mit "Projects: Read")
    #   # owner: <user-login>        # User-Projekt (T25c) …
    #   # identity: project_reader   # … nur mit der github_token-Identity lesbar
    #   fields: { Status: single_select, Priority: single_select, Estimate: number, Due: date }
  test_b:
    type: github
    owner: ADISPATCH_TEST_OWNER
    repository: orch-test-b
    identity: maintainer
