# workflows/reviewer-project-b.yaml – filters on GitHub Projects fields (WI-14) and sets them (WI-16).
# Disabled example: project_b declares the project fields Status/Priority/Estimate in sources.yaml.
# Setting project fields needs write access to the project ("Organization → Projects: Read and write").
id: reviewer-project-b
name: Reviewer – Project B
enabled: false
priority: 40
identity: reviewer

trigger:
  type: source
  source: project_b

filter:
  all:
    # "A or B": operator "in" (values compare case-sensitively, as written in the project)
    - { field: project.Status, operator: in, value: [Ready for Review, In Review] }
    - { field: labels, operator: contains, value: needs-review }

item_priority:
  rules:
    - when: { field: project.Priority, operator: equals, value: P0 }
      value: 100
    - when: { field: project.Estimate, operator: less_than, value: 3 }
      value: 10
  default: 0

execute:
  type: shell
  command: /etc/adispatchd/scripts/reviewer.sh
  args: ['{item.url}']
  timeout:
    max_duration: 2h

on_start:
  - type: source.update
    project: { Status: In Review }

on_success:
  - type: source.update
    labels: { add: [reviewed], remove: [needs-review] }
    project: { Status: Done }

# Named outcomes (WI-17): the reviewer script writes e.g.
#   {"schema_version": 1, "result": "failure", "outcome": "changes_requested", "message": "..."}
# into $ADISPATCH_RESULT_FILE. A matching entry runs instead of on_success/on_failure;
# an outcome without entry falls back to on_success/on_failure (warning on the run).
on_result:
  approved:
    - type: source.update
      labels: { add: [approved], remove: [needs-review] }
      project: { Status: Done }
  changes_requested:
    - type: source.update
      labels: { add: [changes-requested], remove: [needs-review] }
    - type: source.comment
      message: 'Changes requested: {result.message}'

# One chain for crashed, start_error, timed_out and cancelled (WI-17); a specific hook
# (e.g. on_timeout, even as []) would take precedence.
on_error:
  - type: source.comment
    message: 'Review run {run.id} ended with {result.status}; it will be retried.'
