# workflows/coder-project-a.yaml (Spec §5.4)
id: coder-project-a
name: Coder – Project A
enabled: true
priority: 50
max_concurrent: 3
identity: coder

trigger:
  type: source
  source: project_a

filter:
  all:
    - { field: labels, operator: contains, value: ready-for-coding }
    - { field: dependencies.blocked_by_open, operator: equals, value: 0 }
    # Named filter (filters/needs-maintainer.yaml): skip items still waiting for the maintainer.
    - not: { use: needs-maintainer }

item_priority:
  rules:
    - when: { field: labels, operator: contains, value: 'priority:critical' }
      value: 100
    - when: { field: labels, operator: contains, value: 'priority:high' }
      value: 50
  default: 0

conditions:
  workflow:
    - name: Credits available
      type: shell
      command: /etc/adispatchd/scripts/check-credits.sh
      timeout: 15s
      cache: 60s
  item: []

execute:
  type: shell
  command: /etc/adispatchd/scripts/coder.sh
  working_directory: '{workspace.base_dir}/{workflow.id}/{run.id}'
  create_directory: true
  env:
    NODE_ENV: production
  secrets:
    GH_TOKEN:
      identity: coder
      # delivery: file   # instead of GH_TOKEN: path in GH_TOKEN_FILE, renewed while the worker runs (0.3.0)
  timeout:
    max_duration: 6h
    idle_timeout: 45m
  # Copied to data-dir/runs/<run-id>/kept/ before the workspace cleanup (relative globs: *, ?, **).
  keep:
    - .agent/transcript.jsonl
    - .agent/gate/*.log
  keep_max_size: 50MB

retry:
  max_technical_failures: 3

on_start:
  - type: source.update
    labels: { add: [coding], remove: [ready-for-coding] }
    # With a GitHub project on the source (sources.yaml → project), project fields can be set too
    # (labels first, then project fields; null clears a field):
    # project: { Status: In Progress }
  - type: source.comment
    message: 'Coder started, run {run.id}.'
    identity: coder

on_success:
  - type: source.update
    labels: { add: [ready-for-review], remove: [coding] }
  - type: source.comment
    message: 'Completed: {result.message}'
    identity: coder
    continue_on_error: true

on_failure:
  - type: source.update
    labels: { add: [needs-maintainer], remove: [coding] }
  - type: source.comment
    message: 'Needs maintainer: {result.message}'

on_crash:
  - type: source.update
    labels: { add: [ready-for-coding], remove: [coding] }

on_start_error:
  - type: source.update
    labels: { add: [ready-for-coding], remove: [coding] }

on_cancel:
  - type: source.update
    labels: { add: [ready-for-coding], remove: [coding] }

on_timeout:
  - type: source.update
    labels: { add: [ready-for-coding], remove: [coding] }

# Retry block (0.6.0): after max_technical_failures technical failures in a row the item is blocked.
# on_retry_block runs in that run after on_crash/on_start_error/on_timeout and marks the item;
# on_retry_unblock runs in its own lifecycle run (trigger "unblock") when the block is removed.
on_retry_block:
  - type: source.update
    labels: { add: [agent-blocked], remove: [ready-for-coding] }
  - type: source.comment
    message: 'Blocked after {block.failures} technical failures (last {block.last_status}, run {run.id}).'

on_retry_unblock:
  - type: source.update
    labels: { add: [ready-for-coding], remove: [agent-blocked] }
  - type: source.comment
    message: 'Retry block {block.id} removed by {block.cleared_by}.'
