# Global settings (Spec §5.1)
server:
  host: 127.0.0.1
  port: 8787
  # Extra host names accepted in Host/Origin headers (e.g. the public name of an
  # authenticating reverse proxy); loopback names are always accepted.
  allowed_hosts: []

scheduler:
  polling_interval: 30s
  max_concurrent: 5

workspace:
  base_dir: /var/lib/adispatchd/workspaces
  cleanup: on_success  # always | on_success | never

lifecycle:
  action_retry:
    max_attempts: 3
    delay: 30s

retention:
  completed_runs: 30d
  failed_runs: 90d
  blocked_runs: never
  max_log_size_per_run: 100MB
  cleanup_interval: 24h

notifications:
  # Admin/orchestrator notifications (Spec §18). Channels are optional, e.g.:
  # channels:
  #   - type: webhook
  #     url_env: SLACK_WEBHOOK_URL
  #     headers_env: { Authorization: WEBHOOK_AUTH_HEADER }
  on: [retry_block_created, lifecycle_action_failed, recovery_failed]

# Web UI: external tools in the toolbar (optional). url = how the BROWSER reaches the tool.
# embed: true shows it inside the UI (#/tools/<id>), false (default) opens a new tab.
# Example: the claude-inspect dashboard as a local service (claude-inspect service install → port 47717):
# ui:
#   external_links:
#     - id: claude-inspect
#       label: Claude Inspect
#       url: http://127.0.0.1:47717/
#       embed: true

# Login for web UI and API (optional, default mode: none = no login). Roles: viewer | operator | admin.
# password: hashes from `adispatch auth hash-password`, stored in the service environment (never in YAML).
# trusted_header: identity from an authenticating proxy, e.g. `tailscale serve --bg http://127.0.0.1:8787`.
# CLI control commands keep working through <data-dir>/control.token (pass --data-dir).
# auth:
#   mode: password
#   users:
#     - { name: alice, password_hash_env: ADISPATCH_PW_ALICE, role: admin }
#   # mode: trusted_header
#   # trusted_header:
#   #   header: Tailscale-User-Login
#   #   trusted_proxies: [127.0.0.1, ::1]
#   #   users:
#   #     - { login: alice@example.com, role: admin }
